name: Workflow tests

# Runs the shell steps of register-manifest.yml against ordinary and hostile
# agent_id values (tests/test_register_workflow.py). That workflow runs on
# issues anyone can open and can write to the repository, so a change to it
# is tested before it reaches main.
on:
  pull_request:
    paths:
      - ".github/workflows/register-manifest.yml"
      - ".github/workflows/workflow-tests.yml"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/register-manifest.yml"
      - ".github/workflows/workflow-tests.yml"
      - "tests/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run workflow tests
        run: python3 -m unittest discover -s tests -v
