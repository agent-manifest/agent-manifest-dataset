name: Agent Registry

on:
  pull_request:
    paths:
      - "manifests/**"
      - "registry.json"
  push:
    branches:
      - main
    paths:
      - "manifests/**"
      - "registry.json"

jobs:
  # Pull requests must arrive with registry.json already in sync.
  verify-registry:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify registry.json is in sync with manifests
        run: |
          python3 <<'PY'
          import json
          import os
          import sys

          agents = sorted(
              os.path.join(root, file).replace("\\", "/")
              for root, dirs, files in os.walk("manifests")
              for file in files
              if file.endswith(".json")
          )

          with open("registry.json", encoding="utf-8") as f:
              current = json.load(f)

          # Compare only the agent set; generated_at is non-deterministic and ignored.
          if current.get("agents") != agents:
              print("registry.json is out of sync with manifests/**")
              print("expected agents:", agents)
              print("found agents:   ", current.get("agents"))
              sys.exit(1)

          if current.get("registry_version") != "1.1":
              print(f"registry_version is {current.get('registry_version')!r}, expected '1.1'")
              sys.exit(1)

          if not isinstance(current.get("base_url"), str):
              print("registry.json is missing base_url")
              sys.exit(1)

          if not isinstance(current.get("index"), list):
              print("registry.json is missing index (required since registry_version 1.1)")
              sys.exit(1)

          print("registry.json in sync with manifests/**:", len(agents), "agents,",
                len(current["index"]), "indexed")
          PY

  # Direct commits to manifests/** (e.g. Diplomat submissions via the
  # Contents API) do not carry a registry update, so main regenerates
  # registry.json itself. The bot commit is pushed with GITHUB_TOKEN,
  # which does not trigger workflows, so this cannot loop.
  sync-registry:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: registry-sync
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate registry.json
        run: python3 scripts/generate-registry.py

      - name: Check whether registry changed
        id: regen
        run: |
          python3 <<'PY'
          import json, os, subprocess

          with open('registry.json', encoding='utf-8') as f:
              new_text = f.read()
          new = json.loads(new_text)

          committed_text = subprocess.check_output(
              ['git', 'show', 'HEAD:registry.json']
          ).decode('utf-8')
          committed = json.loads(committed_text)

          def without_ts(d):
              return {k: v for k, v in d.items() if k != 'generated_at'}

          if without_ts(new) == without_ts(committed):
              # Only generated_at differs — restore committed file so no spurious commit
              with open('registry.json', 'w', encoding='utf-8') as f:
                  f.write(committed_text)
              print('registry.json unchanged (only generated_at differed)')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('changed=false\n')
          else:
              print('registry.json updated')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('changed=true\n')
          PY

      - name: Commit and push updated registry
        if: steps.regen.outputs.changed == 'true'
        run: |
          git config user.name "manifest-bot"
          git config user.email "bot@agent-manifest.local"
          git add registry.json
          git commit -m "chore: sync registry.json with manifests"
          git pull --rebase origin main
          git push origin main
