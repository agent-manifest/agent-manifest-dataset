name: Register Agent Manifest

on:
  issues:
    types: [opened]

jobs:
  register:
    # Only issues created from the manifest-submission template; other
    # issues must not trigger registration attempts or failure comments.
    if: contains(github.event.issue.labels.*.name, 'manifest-submission')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    # Serialize with sync-registry (same group) so two simultaneous
    # registrations, or a registration racing a registry sync, never
    # collide on push.
    concurrency:
      group: registry-sync
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract JSON from issue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 <<'PY'
          import os
          import re

          body = os.environ["ISSUE_BODY"]

          match = re.search(r"```json\s*(.*?)\s*```", body, re.DOTALL)
          if not match:
              raise SystemExit("No JSON block found in issue body.")

          json_text = match.group(1).strip()

          if not json_text:
              raise SystemExit("Extracted JSON block is empty.")

          with open("manifest.json", "w", encoding="utf-8") as f:
              f.write(json_text)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # This repository used to keep its own copy of the schema and check it
      # against a checksum written here, then run its own ajv-cli against that
      # copy. The copy is gone. The schema and the checking both come from
      # @agent-manifest/client, pinned to an exact version and installed from
      # the registry, so a manifest submitted here gets the same verdict the
      # CLI and the Diplomat would give it.
      - name: Install the shared validator
        run: npm install --no-save --no-package-lock @agent-manifest/client@0.1.0

      - name: Validate manifest against the v1.0 schema
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import { validate } from "@agent-manifest/client/validate";
            const document = JSON.parse(await readFile("manifest.json", "utf8"));
            const { schemaValid, errors, schemaVersion } = validate(document);
            if (schemaValid) {
              console.log(`Valid against Agent Manifest v${schemaVersion}.`);
            } else {
              for (const e of errors) console.error(`${e.path} ${e.message}`);
              process.exit(1);
            }
          '

      - name: Get date
        id: date
        run: |
          echo "year=$(date +%Y)" >> $GITHUB_OUTPUT
          echo "month=$(date +%m)" >> $GITHUB_OUTPUT

      - name: Get agent ID
        id: agent_id
        run: |
          NAME=$(python3 -c "import json; print(json.load(open('manifest.json', encoding='utf-8'))['agent_id'])")
          SAFE_NAME=$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed 's/ /-/g')
          echo "name=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Move manifest
        run: |
          NAME="${{ steps.agent_id.outputs.name }}"
          # The dataset is append-only: an agent_id may be registered once.
          EXISTING=$(find manifests -name "$NAME.json" -type f | head -1)
          if [ -n "$EXISTING" ]; then
            echo "agent_id '$NAME' is already registered at $EXISTING"
            echo "The dataset is append-only; resubmission does not replace an existing declaration."
            exit 1
          fi
          mkdir -p manifests/${{ steps.date.outputs.year }}/${{ steps.date.outputs.month }}
          mv manifest.json manifests/${{ steps.date.outputs.year }}/${{ steps.date.outputs.month }}/$NAME.json

      # The manifest is committed before the index is generated, so that
      # registered_at can be read from git history rather than from the clock.
      # It records what the registry did, and the commit is what it did.
      - name: Commit the manifest
        run: |
          git config user.name "manifest-bot"
          git config user.email "bot@agent-manifest.local"
          git add manifests
          git commit -m "auto-register manifest from issue #${{ github.event.issue.number }}" || echo "No changes"

      - name: Generate registry.json
        run: python3 scripts/generate-registry.py

      - name: Commit the registry index
        run: |
          git add registry.json
          git commit -m "regenerate registry index for issue #${{ github.event.issue.number }}" || echo "No changes"
          git pull --rebase origin main
          git push

      - name: Comment and close issue on success
        if: success()
        uses: actions/github-script@v7
        env:
          REGISTERED_PATH: manifests/${{ steps.date.outputs.year }}/${{ steps.date.outputs.month }}/${{ steps.agent_id.outputs.name }}.json
        with:
          script: |
            const registeredPath = process.env.REGISTERED_PATH;

            const successBody = [
              "Registration processed successfully.",
              "",
              "The manifest has been added to the public dataset and the registry index has been updated.",
              "",
              "Registered manifest:",
              registeredPath
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: successBody
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const failureBody = [
              "Manifest registration failed.",
              "",
              "The submitted manifest could not be processed automatically.",
              "",
              "Please review the workflow logs in Actions, correct the issue body if needed, and submit a new manifest.",
              "",
              "Required fields (Agent Manifest v1.0):",
              "  manifest_version, agent_id, agent_name, agent_version,",
              "  owner, purpose, forbidden_actions, autonomy,",
              "  risk_profile, data_handling, stopping_authority, audit_surface, contact",
              "",
              "Common validation failures:",
              "- manifest_version must be exactly '1.0'",
              "- forbidden_actions must be a non-empty array",
              "- autonomy.level must be an integer (0-3)",
              "- purpose must be an object with primary_code and description",
              "- owner must have type (individual, organization, or system) and identifier",
              "- risk_profile.level must be one of: low, medium, high",
              "- data_handling.stores_personal_data must be a boolean",
              "- data_handling.retention is required when stores_personal_data is true",
              "- stopping_authority must have stoppable_by (array) and mechanism",
              "- audit_surface.logging must be one of: none, basic, detailed",
              "- audit_surface.reconstructability must be one of: none, partial, full",
              "- contact.email is required",
              "- agent_id must not already exist in the dataset (append-only)"
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: failureBody
            });
